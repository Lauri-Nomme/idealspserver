name: Release
on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:

jobs:
  release:
    name: Build jar and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        run: |
          COUNT=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "VERSION=1.0.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "TAG=v1.0.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "SHA=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build plugin
        uses: gradle/gradle-build-action@v3
        env:
          IDEALSP_VERSION: ${{ steps.version.outputs.VERSION }}
        with:
          arguments: :buildPlugin --no-daemon -q
          build-root-directory: server

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build xlsp CLI
        run: |
          cd tools/xlsp
          bun run build:all

      - name: Find previous release tag
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            echo "TAG=$PREV" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release notes
        id: notes
        run: |
          NOTES=/tmp/release-notes.md
          {
            echo "## IdeaLSP ${{ steps.version.outputs.VERSION }}-g${{ steps.version.outputs.SHA }}"
            echo
            echo "### Commits since last release"
            echo
            if [ -n "${{ steps.previous.outputs.TAG }}" ]; then
              git log "${{ steps.previous.outputs.TAG }}..HEAD" --pretty=format:"- %h %s" --no-merges
            else
              git log HEAD --pretty=format:"- %h %s" --no-merges
            fi
            echo
            echo "### Assets"
            echo
            echo "- \`idealsp-${{ steps.version.outputs.VERSION }}.jar\` — IntelliJ plugin"
            echo "- \`idealsp-${{ steps.version.outputs.VERSION }}.zip\` — IntelliJ plugin distribution"
            echo "- \`xlsp-linux-x64\` — xlsp CLI (Linux x64, standalone)"
            echo "- \`xlsp-linux-arm64\` — xlsp CLI (Linux ARM64, standalone)"
            echo "- \`xlsp-darwin-x64\` — xlsp CLI (macOS x64, standalone)"
            echo "- \`xlsp-darwin-arm64\` — xlsp CLI (macOS ARM64, standalone)"
            echo "- \`xlsp-windows-x64.exe\` — xlsp CLI (Windows x64, standalone)"
          } > "$NOTES"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG=${{ steps.version.outputs.TAG }}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi
          gh release create "$TAG" \
            "server/build/distributions/idealsp-${VERSION}.zip" \
            "server/build/libs/idealsp-${VERSION}.jar" \
            "dist/xlsp-linux-x64" \
            "dist/xlsp-linux-arm64" \
            "dist/xlsp-darwin-x64" \
            "dist/xlsp-darwin-arm64" \
            "dist/xlsp-windows-x64.exe" \
            --title "IdeaLSP ${VERSION}-g${{ steps.version.outputs.SHA }}" \
            --notes-file /tmp/release-notes.md
